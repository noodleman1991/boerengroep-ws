services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload_test"]
      interval: 2s
      timeout: 3s
      retries: 20
